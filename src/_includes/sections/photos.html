<section id="photos" class="alt">
    <div class="wrap">
        <div class="section-head">
            <h2>Photos</h2>
        </div>
        <div class="photos-grid">
            {% for photo in galleryPhotos %}
            <button type="button" class="img-placeholder has-photo photo-trigger" aria-label="View photo larger">
                {% galleryImage photo.src, photo.alt %}
            </button>
            {% endfor %}
        </div>
    </div>
</section>
