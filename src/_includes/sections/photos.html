<section id="photos" class="alt">
    <div class="wrap">
        <div class="section-head">
            <h2>Photos</h2>
        </div>
        <div class="photos-grid">
            {% for photo in galleryPhotos %}
            <div class="img-placeholder has-photo">
                {% galleryImage photo.src, photo.alt %}
            </div>
            {% endfor %}
        </div>
    </div>
</section>
