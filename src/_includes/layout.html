<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dastonia</title>

    <!-- ===== SEO / sharing essentials ===== -->
    <meta name="description" content="Dastonia — metal band from Bern, Switzerland. Original songs, modern sound. Music, shows, photos & contact.">

    <!-- Open Graph (Instagram/Discord/Facebook link previews) -->
    <meta property="og:title" content="Dastonia">
    <meta property="og:description" content="Metal band from Bern, Switzerland. Original songs, modern sound.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.dastonia.com">
    <meta property="og:image" content="https://www.dastonia.com/assets/og-image.jpg">

    <!-- Twitter/X card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Dastonia">
    <meta name="twitter:description" content="Metal band from Bern, Switzerland. Original songs, modern sound.">
    <meta name="twitter:image" content="https://www.dastonia.com/assets/og-image.jpg">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/favicon-32x32.png">
    <link rel="apple-touch-icon" href="/assets/favicon/apple-touch-icon.png">

    <!-- Type system: Montserrat (logo) / Big Shoulders Display (headings) / Inter (body) / Space Mono (labels) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Big+Shoulders+Display:wght@600;700;800;900&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/styles.css">
    {% if extra_css %}
    <link rel="stylesheet" href="{{ extra_css }}">
    {% endif %}
</head>
<body>

<!-- ============ NAVIGATION ============ -->
<header class="site-nav">
    <a href="/" class="nav-wordmark">DASTONIA</a>

    <button id="nav-toggle" class="nav-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="nav-list">
        <span></span>
        <span></span>
        <span></span>
    </button>

            <li><a href="/#home">Home</a></li>

            <li><a href="/#contact">Contact</a></li>
        </ul>
    </nav>
</header>

<div class="fracture" aria-hidden="true"></div>

<main>
    {{ content }}
</main>

                    <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
                    <circle cx="12" cy="12" r="4"/>
                    <circle cx="17.5" cy="6.5" r="0.5" fill="currentColor" stroke="none"/>
                </svg>

        </li>
        <li>
            <a href="https://www.tiktok.com/@dastonia66" target="_blank" rel="noopener" aria-label="TikTok">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">

    <p class="footer-copy">&copy; <span id="year"></span> Dastonia. All rights reserved. · <a href="/impressum/">Impressum</a></p>

<script src="/js/script.js"></script>
{% if extra_js %}

{% endif %}
