<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if title %}{{ title }}{% else %}Dastonia — Metalcore from Bern{% endif %}</title>

    <!-- ===== SEO / sharing essentials ===== -->
    <meta name="description" content="Dastonia — metalcore band from Bern, Switzerland. Heavy guitars and powerful drums pulled toward something more spherical, where the atmosphere cracks and the fragile parts show through.">

    <!-- Open Graph (Instagram/Discord/Facebook link previews) -->
    <meta property="og:title" content="Dastonia">
    <meta property="og:description" content="Metalcore band from Bern, Switzerland. Original songs, modern sound.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.dastonia.com">
    <meta property="og:image" content="https://www.dastonia.com/assets/og-image.jpg">

    <!-- Twitter/X card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Dastonia">
    <meta name="twitter:description" content="Metalcore band from Bern, Switzerland. Original songs, modern sound.">
    <meta name="twitter:image" content="https://www.dastonia.com/assets/og-image.jpg">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/favicon-32x32.png">
    <link rel="apple-touch-icon" href="/assets/favicon/apple-touch-icon.png">

    <!-- Type system: Syncopate (logo) / Unbounded (headings) / Inter (body) / Space Mono (labels) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Unbounded:wght@500;700;900&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/styles.css">
    {% if extra_css %}
    <link rel="stylesheet" href="{{ extra_css }}">
    {% endif %}
</head>
<body>

<header>
    <div class="wrap nav-inner">
        <a href="/" class="nav-logo">
            DASTONIA
            <span class="glitch-layer" aria-hidden="true">DASTONIA</span>
        </a>
        <nav aria-label="Primary">
            <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="navMenu">
                <span></span><span></span><span></span>
            </button>
            <ul id="navMenu">
                <li><a href="/#bio">Bio</a></li>
                <li><a href="/#photos">Photos</a></li>
                <li><a href="/#music">Music</a></li>
                <li><a href="/#shows">Shows</a></li>
                <li><a href="/#press">Press</a></li>
                <li><a href="/#contact">Contact</a></li>
            </ul>
        </nav>
    </div>
</header>

<main id="top">
    {{ content }}
</main>

<footer>
    <div class="wrap footer-bottom">
        <div class="copyright">&copy; <span id="year"></span> Dastonia. All rights reserved.</div>
        <div class="footer-legal">
            <a href="/impressum/">Impressum</a>
            <a href="/privacy/">Privacy policy</a>
            <a href="#top" class="back-to-top">Back to top ↑</a>
        </div>
    </div>
</footer>

<script src="/js/script.js"></script>
{% if extra_js %}
<script src="{{ extra_js }}"></script>
{% endif %}

</body>
</html>
